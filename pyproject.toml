[project]
name = "agronexus-ai"
version = "0.1.0"
description = "AI-powered platform connecting Ethiopian farmers to agro-industry"
authors = [
    {name = "Tsegay Assefa", email = "tsegayassefa27@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "numpy>=2.5.1,<3.0",
    "pandas>=2.3.3,<4.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "ultralytics>=8.3.0",
    "langchain>=1.3.14,<2.0.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=0.1.0",
    "langchain-google-genai>=4.3.2",
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=3.0.0",
    "prophet>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"
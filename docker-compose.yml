services:
  postgres:
    image: postgres:16-alpine
    container_name: agronexus-postgres
    env_file:
      - .env.db
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agronexus-pgadmin
    env_file:
      - .env.pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: agronexus-ai-service
    ports:
      - "8000:8000"
    env_file:
      - ai-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agronexus-backend
    ports:
      - "4000:4000"
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agronexus-frontend
    ports:
      - "3000:3000"
    environment:
      # Absolute URL the browser uses to reach the backend. This is baked
      # into the Next.js client bundle at build time, so it must be
      # reachable from the end-user's network, not from inside the compose
      # network.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres_data:
  pgadmin_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: agronexus-postgres
    env_file:
      - .env.db
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agronexus-pgadmin
    env_file:
      - .env.pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  ai-service:
    build: ./ai-service
    container_name: agronexus-ai-service
    ports:
      - "8000:8000"
    env_file:
      - ai-service/.env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: agronexus-backend
    ports:
      - "4000:4000"
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: agronexus-frontend
    ports:
      - "3000:3000"
    environment:
      # The /api/v1 rewrite runs inside this container, so it must address
      # ai-service by its compose service name. "localhost" here would resolve
      # to the frontend container itself and every API call would 404.
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - ai-service

volumes:
  postgres_data:
  pgadmin_data:
